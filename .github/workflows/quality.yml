name: Qualidade
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check autoflow tests scripts
      - run: ruff format --check autoflow tests scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python scripts/security_audit.py
      - run: python -m pip_audit -r requirements.txt
