[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autoflow-admin"
version = "1.0.0"
description = "Validação e consolidação rastreável de registros administrativos CSV e XLSX"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Diogo Borges Gonçalves Pereira"}]
dependencies = ["openpyxl==3.1.5", "defusedxml==0.7.1"]

[project.scripts]
autoflow = "autoflow.cli:main"

[tool.setuptools.packages.find]
include = ["autoflow*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
